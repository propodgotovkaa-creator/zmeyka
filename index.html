<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Змейка: собери картинки</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #8fdbe8;
}

#FX_ROOT {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  cursor: default;
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.65), transparent 18%),
    radial-gradient(circle at 80% 75%, rgba(255,255,255,.35), transparent 22%),
    linear-gradient(135deg, #8ce3d1, #8fcff4);
}

#FX_ROOT::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .22;
  background-image:
    linear-gradient(30deg, rgba(255,255,255,.55) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,.55) 87.5%),
    linear-gradient(150deg, rgba(255,255,255,.55) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,.55) 87.5%);
  background-size: 80px 140px;
  pointer-events: none;
}

#gameArea {
  position: absolute;
  inset: 20px;
  border: 6px solid rgba(255,255,255,.9);
  border-radius: 30px;
  background: rgba(255,255,255,.16);
  box-shadow:
    inset 0 0 45px rgba(255,255,255,.45),
    inset 0 0 35px rgba(0,80,120,.12),
    0 18px 40px rgba(0,80,120,.18);
  overflow: hidden;
}

#score {
  position: absolute;
  top: 18px;
  left: 22px;
  z-index: 30;
  font-size: 26px;
  font-weight: 900;
  color: #24566b;
  background: rgba(255,255,255,.86);
  padding: 8px 18px;
  border-radius: 20px;
}

#startScreen, #endScreen {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.72);
  text-align: center;
}

.panel {
  background: white;
  border-radius: 30px;
  padding: 34px 42px;
  box-shadow: 0 16px 45px rgba(0,0,0,.22);
  max-width: 500px;
}

.panel h1 {
  margin: 0 0 16px;
  font-size: 42px;
  color: #28566c;
}

.panel p {
  font-size: 21px;
  color: #48616d;
}

button {
  border: none;
  border-radius: 22px;
  padding: 16px 34px;
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(#ffe27a, #ffbd38);
  color: #5a3b00;
  cursor: pointer;
  box-shadow: 0 8px 0 #d49b20, 0 12px 18px rgba(0,0,0,.18);
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 4px 0 #d49b20;
}

/* КУРСОР ИГРЫ */

#crosshair {
  position: absolute;
  width: 28px;
  height: 28px;
  border: 3px solid rgba(40,86,108,.85);
  border-radius: 50%;
  pointer-events: none;
  z-index: 7;
  display: none;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 2px 3px rgba(255,255,255,.8));
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: rgba(40,86,108,.85);
}

#crosshair::before {
  width: 38px;
  height: 3px;
  top: 12px;
  left: -8px;
}

#crosshair::after {
  width: 3px;
  height: 38px;
  left: 12px;
  top: -8px;
}

/* ТЕЛО */

.snake-part {
  position: absolute;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,.95) 0 10%, transparent 18%),
    radial-gradient(circle at 34% 30%, #e46aff 0 18%, #b832f0 46%, #7a19c8 78%, #4f0d91 100%);
  box-shadow:
    inset -7px -8px 0 rgba(52,0,96,.22),
    inset 4px 5px 0 rgba(255,255,255,.22),
    0 7px 12px rgba(72,0,120,.34);
}

.snake-part::after {
  content: "";
  position: absolute;
  left: 18%;
  top: 12%;
  width: 34%;
  height: 22%;
  border-radius: 50%;
  background: rgba(255,255,255,.42);
  filter: blur(1px);
}

/* МИЛАЯ ГОЛОВА */

.snake-head {
  width: 58px !important;
  height: 58px !important;
  z-index: 15;
  border-radius: 48% 52% 50% 50%;
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,.95) 0 10%, transparent 19%),
    radial-gradient(circle at 34% 30%, #ff82ff 0 15%, #c93cf3 45%, #871bd1 78%, #5b0c9c 100%);
  box-shadow:
    inset -8px -9px 0 rgba(52,0,96,.23),
    inset 5px 5px 0 rgba(255,255,255,.25),
    0 9px 16px rgba(72,0,120,.38);
}

.snake-face {
  position: absolute;
  inset: 0;
}

.eye {
  position: absolute;
  top: 9px;
  width: 17px;
  height: 21px;
  background: #fff7a8;
  border-radius: 50%;
  border: 3px solid rgba(75,35,100,.32);
  box-shadow: 0 2px 4px rgba(0,0,0,.22);
}

.eye.left { left: 8px; }
.eye.right { right: 8px; }

.eye::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 8px;
  left: 5px;
  top: 8px;
  background: #24304a;
  border-radius: 50%;
  box-shadow: -2px -2px 0 rgba(255,255,255,.9);
}

.nose {
  position: absolute;
  left: 50%;
  top: 28px;
  width: 5px;
  height: 4px;
  background: rgba(65,25,90,.45);
  border-radius: 50%;
  transform: translateX(-50%);
}

.cheek {
  position: absolute;
  top: 33px;
  width: 10px;
  height: 7px;
  background: rgba(255,170,220,.7);
  border-radius: 50%;
  filter: blur(.2px);
}

.cheek.left { left: 9px; }
.cheek.right { right: 9px; }

.smile {
  position: absolute;
  left: 50%;
  top: 32px;
  width: 18px;
  height: 10px;
  border-bottom: 3px solid rgba(55,20,75,.65);
  border-radius: 0 0 20px 20px;
  transform: translateX(-50%);
}

.tongue {
  position: absolute;
  left: 50%;
  top: 42px;
  width: 6px;
  height: 9px;
  background: #ff6aa8;
  border-radius: 0 0 7px 7px;
  transform: translateX(-50%);
}

/* ПРЕДМЕТЫ */

.collect-item {
  position: absolute;
  width: 58px;
  height: 58px;
  transform: translate(-50%, -50%);
  z-index: 8;
  font-size: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.25));
  animation: floatItem 1.2s ease-in-out infinite alternate;
}

@keyframes floatItem {
  from { transform: translate(-50%, -50%) scale(.94); }
  to { transform: translate(-50%, -58%) scale(1.06); }
}

.bomb {
  position: absolute;
  width: 56px;
  height: 56px;
  transform: translate(-50%, -50%);
  z-index: 9;
  font-size: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 7px 9px rgba(0,0,0,.28));
}

.bomb.safe {
  animation: blink .18s infinite alternate;
  opacity: .45;
}

@keyframes blink {
  from { opacity: .25; transform: translate(-50%, -50%) scale(.9); }
  to { opacity: .85; transform: translate(-50%, -50%) scale(1.08); }
}

.pop {
  position: absolute;
  font-size: 38px;
  pointer-events: none;
  animation: pop .6s ease-out forwards;
  z-index: 30;
}

@keyframes pop {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
  to { opacity: 0; transform: translate(-50%, -95%) scale(1.5); }
}
</style>
</head>

<body>
<div id="FX_ROOT">

  <div id="gameArea"></div>

  <div id="score">0 / 10</div>
  <div id="crosshair"></div>

  <div id="startScreen">
    <div class="panel">
      <h1>Змейка</h1>
      <p>Собери 10 картинок и не попади в бомбочки.</p>
      <button id="startBtn">Начать игру</button>
    </div>
  </div>

  <div id="endScreen" style="display:none;">
    <div class="panel">
      <h1 id="endTitle">Победа!</h1>
      <p id="endText">Ты собрал все картинки!</p>
      <button id="restartBtn">Играть снова</button>
    </div>
  </div>

</div>

<script>
(function () {
  const root = document.getElementById("FX_ROOT");
  const area = document.getElementById("gameArea");
  const scoreEl = document.getElementById("score");
  const startScreen = document.getElementById("startScreen");
  const endScreen = document.getElementById("endScreen");
  const startBtn = document.getElementById("startBtn");
  const restartBtn = document.getElementById("restartBtn");
  const endTitle = document.getElementById("endTitle");
  const endText = document.getElementById("endText");
  const crosshair = document.getElementById("crosshair");

  const SETTINGS = {
    targetCount: 10,
    snakeSpeed: 3,
    segmentDistance: 18,
    startLength: 13,
    growBy: 2,
    itemEmoji: "🍎",
    bombEmoji: "💣",
    bombCount: 4,
    bombLifeMs: 10000,
    bombSafeMs: 1000,
    bombRespawnDelayMs: 700,
    wallPadding: 28
  };

  let playing = false;
  let collected = 0;
  let mouse = { x: 300, y: 300 };
  let snake = [];
  let item = null;
  let bombs = [];
  let animationId = null;
  let bombTimer = null;

  function areaRect() {
    return area.getBoundingClientRect();
  }

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function clearGame() {
    area.querySelectorAll(".snake-part, .collect-item, .bomb, .pop").forEach(el => el.remove());
    bombs = [];
    snake = [];
    item = null;
    if (animationId) cancelAnimationFrame(animationId);
    if (bombTimer) clearTimeout(bombTimer);
  }

  function createSnakePart(isHead) {
    const part = document.createElement("div");
    part.className = "snake-part" + (isHead ? " snake-head" : "");

    if (isHead) {
      part.innerHTML = `
        <div class="snake-face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="smile"></div>
          <div class="tongue"></div>
        </div>
      `;
    }

    area.appendChild(part);
    return part;
  }

  function startGame() {
    clearGame();

    playing = true;
    collected = 0;
    scoreEl.textContent = "0 / " + SETTINGS.targetCount;

    startScreen.style.display = "none";
    endScreen.style.display = "none";
    crosshair.style.display = "block";
    root.style.cursor = "none";

    const rect = areaRect();
    const startX = rect.width / 2;
    const startY = rect.height / 2;

    mouse.x = startX + 160;
    mouse.y = startY;

    for (let i = 0; i < SETTINGS.startLength; i++) {
      const part = createSnakePart(i === 0);
      snake.push({
        x: startX - i * SETTINGS.segmentDistance,
        y: startY,
        el: part
      });
    }

    spawnItem();
    spawnBombsCycle();
    loop();
  }

  function endGame(win) {
    playing = false;

    if (animationId) cancelAnimationFrame(animationId);
    if (bombTimer) clearTimeout(bombTimer);

    crosshair.style.display = "none";
    root.style.cursor = "default";
    endScreen.style.display = "flex";

    if (win) {
      endTitle.textContent = "Победа!";
      endText.textContent = "Ты собрал все картинки!";
    } else {
      endTitle.textContent = "Попробуй ещё раз!";
      endText.textContent = "Змейка столкнулась с бомбочкой или краем поля.";
    }
  }

  function placeElement(el, x, y) {
    el.style.left = x + "px";
    el.style.top = y + "px";
  }

  function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function safeRandomPoint(margin = 90) {
    const rect = areaRect();
    return {
      x: rand(margin, rect.width - margin),
      y: rand(margin, rect.height - margin)
    };
  }

  function spawnItem() {
    if (item && item.el) item.el.remove();

    let pos;
    let tries = 0;

    do {
      pos = safeRandomPoint(90);
      tries++;
    } while (snake[0] && distance(pos, snake[0]) < 150 && tries < 40);

    const el = document.createElement("div");
    el.className = "collect-item";
    el.textContent = SETTINGS.itemEmoji;
    area.appendChild(el);

    item = { x: pos.x, y: pos.y, el };
    placeElement(el, pos.x, pos.y);
  }

  function collectItem() {
    collected++;
    scoreEl.textContent = collected + " / " + SETTINGS.targetCount;

    makePop(item.x, item.y, "✨");

    if (item && item.el) item.el.remove();
    item = null;

    growSnake();

    if (collected >= SETTINGS.targetCount) {
      endGame(true);
      return;
    }

    spawnItem();
  }

  function growSnake() {
    const tail = snake[snake.length - 1];

    for (let i = 0; i < SETTINGS.growBy; i++) {
      const part = createSnakePart(false);
      snake.push({
        x: tail.x,
        y: tail.y,
        el: part
      });
    }

    const newSize = Math.min(48, 38 + collected * 1.2);

    snake.forEach((part, index) => {
      if (index === 0) return;
      part.el.style.width = newSize + "px";
      part.el.style.height = newSize + "px";
    });
  }

  function spawnBombsCycle() {
    bombs.forEach(b => b.el.remove());
    bombs = [];

    for (let i = 0; i < SETTINGS.bombCount; i++) {
      spawnBomb();
    }

    bombTimer = setTimeout(() => {
      bombs.forEach(b => b.el.remove());
      bombs = [];

      bombTimer = setTimeout(() => {
        if (playing) spawnBombsCycle();
      }, SETTINGS.bombRespawnDelayMs);

    }, SETTINGS.bombLifeMs);
  }

  function spawnBomb() {
    let pos;
    let tries = 0;

    do {
      pos = safeRandomPoint(90);
      tries++;
    } while (snake[0] && distance(pos, snake[0]) < 150 && tries < 50);

    const el = document.createElement("div");
    el.className = "bomb safe";
    el.textContent = SETTINGS.bombEmoji;
    area.appendChild(el);
    placeElement(el, pos.x, pos.y);

    const bomb = {
      x: pos.x,
      y: pos.y,
      el,
      safe: true
    };

    bombs.push(bomb);

    setTimeout(() => {
      if (!playing || !bomb.el) return;
      bomb.safe = false;
      bomb.el.classList.remove("safe");
    }, SETTINGS.bombSafeMs);
  }

  function makePop(x, y, text) {
    const el = document.createElement("div");
    el.className = "pop";
    el.textContent = text;
    area.appendChild(el);
    placeElement(el, x, y);

    setTimeout(() => el.remove(), 650);
  }

  function updateSnake() {
    const head = snake[0];

    const dx = mouse.x - head.x;
    const dy = mouse.y - head.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;

    head.x += (dx / len) * SETTINGS.snakeSpeed;
    head.y += (dy / len) * SETTINGS.snakeSpeed;

    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    head.el.style.transform = "translate(-50%, -50%) rotate(" + angle + "deg)";

    for (let i = 1; i < snake.length; i++) {
      const prev = snake[i - 1];
      const cur = snake[i];

      const dx2 = prev.x - cur.x;
      const dy2 = prev.y - cur.y;
      const d = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;

      if (d > SETTINGS.segmentDistance) {
        cur.x += (dx2 / d) * (d - SETTINGS.segmentDistance);
        cur.y += (dy2 / d) * (d - SETTINGS.segmentDistance);
      }

      cur.el.style.transform = "translate(-50%, -50%)";
    }

    snake.forEach(part => {
      placeElement(part.el, part.x, part.y);
    });
  }

  function checkCollisions() {
    const rect = areaRect();
    const head = snake[0];
    const pad = SETTINGS.wallPadding;

    if (
      head.x < pad ||
      head.y < pad ||
      head.x > rect.width - pad ||
      head.y > rect.height - pad
    ) {
      endGame(false);
      return;
    }

    if (item && distance(head, item) < 46) {
      collectItem();
      return;
    }

    for (const bomb of bombs) {
      if (!bomb.safe && distance(head, bomb) < 46) {
        makePop(head.x, head.y, "💥");
        endGame(false);
        return;
      }
    }
  }

  function loop() {
    if (!playing) return;

    updateSnake();
    checkCollisions();

    animationId = requestAnimationFrame(loop);
  }

  function movePointer(clientX, clientY) {
    const rect = areaRect();

    mouse.x = clientX - rect.left;
    mouse.y = clientY - rect.top;

    crosshair.style.left = clientX + "px";
    crosshair.style.top = clientY + "px";
  }

  root.addEventListener("mousemove", e => {
    if (!playing) return;
    movePointer(e.clientX, e.clientY);
  });

  root.addEventListener("touchmove", e => {
    if (!playing) return;
    e.preventDefault();
    const t = e.touches[0];
    movePointer(t.clientX, t.clientY);
  }, { passive: false });

  startBtn.addEventListener("click", startGame);
  restartBtn.addEventListener("click", startGame);

})();
</script>

</body>
</html>
