<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Гусеница: собери картинки</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #8fdbe8;
}

#FX_ROOT {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  cursor: default;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.55), transparent 34%),
    radial-gradient(circle at 18% 18%, rgba(255,255,255,.35), transparent 18%),
    radial-gradient(circle at 85% 80%, rgba(104,190,118,.35), transparent 24%),
    linear-gradient(135deg, #a9eec1, #7fd8b0 45%, #7bc7e8);
}

#FX_ROOT::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .28;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.9) 0 2px, transparent 3px),
    radial-gradient(circle, rgba(255,244,170,.75) 0 1.5px, transparent 3px);
  background-size: 90px 90px, 130px 130px;
  animation: sparkleDrift 18s linear infinite;
}

@keyframes sparkleDrift {
  from { background-position: 0 0, 0 0; }
  to { background-position: 120px 90px, -90px 130px; }
}

#FX_ROOT::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 50%, transparent 48%, rgba(25,90,60,.22) 100%);
}

#gameArea {
  position: absolute;
  inset: 24px;
  border-radius: 34px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.55), transparent 34%),
    radial-gradient(circle at 35% 35%, rgba(255,255,210,.32), transparent 22%),
    radial-gradient(circle at 75% 70%, rgba(85,180,110,.18), transparent 28%),
    linear-gradient(135deg, #bdf7aa, #91e590 48%, #7bdc9c);
  border: 10px solid rgba(255,255,255,.85);
  box-shadow:
    inset 0 0 45px rgba(255,255,255,.55),
    inset 0 0 80px rgba(44,120,62,.22),
    0 18px 45px rgba(35,105,80,.28);
}

#gameArea::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 24px;
  background:
    linear-gradient(90deg, rgba(50,150,65,.32), transparent 12%, transparent 88%, rgba(50,150,65,.32)),
    linear-gradient(0deg, rgba(50,150,65,.32), transparent 12%, transparent 88%, rgba(50,150,65,.32));
  z-index: 1;
}

#gameArea::after {
  content: "🌿 🌸 🍄 🌼 🌿      🌱 🌷 🍃     🍄 🌸 🌿";
  position: absolute;
  inset: 10px;
  pointer-events: none;
  z-index: 2;
  font-size: 30px;
  letter-spacing: 18px;
  line-height: 1.4;
  color: rgba(255,255,255,.9);
  text-shadow: 0 4px 8px rgba(0,0,0,.16);
  opacity: .8;
}

#score {
  position: absolute;
  top: 18px;
  left: 22px;
  z-index: 30;
  font-size: 26px;
  font-weight: 900;
  color: #24566b;
  background: rgba(255,255,255,.88);
  padding: 8px 18px;
  border-radius: 20px;
  box-shadow: 0 8px 18px rgba(0,0,0,.12);
}

#startScreen, #endScreen {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.72);
  text-align: center;
}

.panel {
  background: white;
  border-radius: 30px;
  padding: 34px 42px;
  box-shadow: 0 16px 45px rgba(0,0,0,.22);
  max-width: 500px;
}

.panel h1 {
  margin: 0 0 16px;
  font-size: 42px;
  color: #28566c;
}

.panel p {
  font-size: 21px;
  color: #48616d;
}

button {
  border: none;
  border-radius: 22px;
  padding: 16px 34px;
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(#ffe27a, #ffbd38);
  color: #5a3b00;
  cursor: pointer;
  box-shadow: 0 8px 0 #d49b20, 0 12px 18px rgba(0,0,0,.18);
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 4px 0 #d49b20;
}

#crosshair {
  position: absolute;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.95);
  border-radius: 50%;
  pointer-events: none;
  z-index: 7;
  display: none;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,.22);
  box-shadow:
    0 0 0 5px rgba(255,255,255,.18),
    0 0 14px rgba(255,255,255,.9),
    0 0 22px rgba(111,210,255,.75);
}

#crosshair::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  background: rgba(40,86,108,.75);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.snake-part {
  position: absolute;
  transform: translate3d(-50%, -50%, 0);
  pointer-events: none;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  z-index: 10;
  will-change: transform, left, top;
  backface-visibility: hidden;
  filter: drop-shadow(0 6px 6px rgba(54,0,80,.16));
}

.snake-head {
  width: 86px;
  height: 86px;
  z-index: 20;
}

.snake-body {
  width: 70px;
  height: 70px;
}

.snake-tail {
  width: 62px;
  height: 62px;
}

.collect-item {
  position: absolute;
  width: 92px;
  height: 92px;
  transform: translate(-50%, -50%);
  z-index: 8;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.25));
  animation: floatItem 1.2s ease-in-out infinite alternate;
}

@keyframes floatItem {
  from { transform: translate(-50%, -50%) scale(.94); }
  to { transform: translate(-50%, -58%) scale(1.06); }
}

.bomb {
  position: absolute;
  width: 72px;
  height: 72px;
  transform: translate(-50%, -50%);
  z-index: 9;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.35));
  animation: bombFloat 1.2s ease-in-out infinite alternate;
}

@keyframes bombFloat {
  from { transform: translate(-50%, -50%) scale(.96) rotate(-2deg); }
  to { transform: translate(-50%, -56%) scale(1.04) rotate(2deg); }
}

.bomb.safe {
  animation: bombSafe .18s infinite alternate;
  opacity: .45;
}

@keyframes bombSafe {
  from { opacity: .25; transform: translate(-50%, -50%) scale(.9); }
  to { opacity: .85; transform: translate(-50%, -50%) scale(1.06); }
}

.explosion {
  position: absolute;
  width: 135px;
  height: 135px;
  transform: translate(-50%, -50%) scale(.35);
  z-index: 40;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  pointer-events: none;
  animation: boom .45s ease-out forwards;
}

@keyframes boom {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.35); }
  to { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
}

.pop {
  position: absolute;
  font-size: 38px;
  pointer-events: none;
  animation: pop .6s ease-out forwards;
  z-index: 30;
}

@keyframes pop {
  from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
  to { opacity: 0; transform: translate(-50%, -95%) scale(1.5); }
}
</style>
</head>

<body>
<div id="FX_ROOT">
  <div id="gameArea"></div>
  <div id="score">0 / 10</div>
  <div id="crosshair"></div>

  <div id="startScreen">
    <div class="panel">
      <h1>Гусеница</h1>
      <p>Собери 10 картинок и не попади в бомбочки.</p>
      <button id="startBtn">Начать игру</button>
    </div>
  </div>

  <div id="endScreen" style="display:none;">
    <div class="panel">
      <h1 id="endTitle">Победа!</h1>
      <p id="endText">Ты собрал все картинки!</p>
      <button id="restartBtn">Играть снова</button>
    </div>
  </div>
</div>

<script>
(function(){
  const root=document.getElementById("FX_ROOT");
  const area=document.getElementById("gameArea");
  const scoreEl=document.getElementById("score");
  const startScreen=document.getElementById("startScreen");
  const endScreen=document.getElementById("endScreen");
  const startBtn=document.getElementById("startBtn");
  const restartBtn=document.getElementById("restartBtn");
  const endTitle=document.getElementById("endTitle");
  const endText=document.getElementById("endText");
  const crosshair=document.getElementById("crosshair");

  const SETTINGS={
    targetCount:10,
    snakeSpeed:3,
    segmentDistance:24,
    startLength:8,
    growBy:1,
    pointerSmooth:.1,
    bodyFollow:.32,

    bombCount:4,
    bombLifeMs:10000,
    bombSafeMs:1000,
    bombRespawnDelayMs:700,
    wallPadding:36,

    itemImage:"https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/%D1%80%D0%BE%D0%B1%D0%BE%D1%82.png",

    headImage:"https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/assets/caterpillar-head.svg",
    bodyImages:[
      "https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/assets/caterpillar-body-1.svg",
      "https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/assets/caterpillar-body-2.svg"
    ],
    tailImage:"https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/assets/caterpillar-tail.svg",
    bombImage:"https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/assets/game-bomb.svg",
    explosionImage:"https://raw.githubusercontent.com/propodgotovkaa-creator/zmeyka/refs/heads/main/assets/bomb-explosion.svg"
  };

  let playing=false;
  let collected=0;
  let mouse={x:300,y:300};
  let targetMouse={x:300,y:300};
  let snake=[];
  let item=null;
  let bombs=[];
  let animationId=null;
  let bombTimer=null;

  function areaRect(){ return area.getBoundingClientRect(); }
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function distance(a,b){
    const dx=a.x-b.x, dy=a.y-b.y;
    return Math.sqrt(dx*dx+dy*dy);
  }
  function placeElement(el,x,y){
    el.style.left=x+"px";
    el.style.top=y+"px";
  }

  function clearGame(){
    area.querySelectorAll(".snake-part,.collect-item,.bomb,.pop,.explosion").forEach(el=>el.remove());
    bombs=[]; snake=[]; item=null;
    if(animationId) cancelAnimationFrame(animationId);
    if(bombTimer) clearTimeout(bombTimer);
  }

  function safeRandomPoint(margin=110){
    const rect=areaRect();
    return {
      x:rand(margin, rect.width-margin),
      y:rand(margin, rect.height-margin)
    };
  }

  function createSnakePart(type,index=0){
    const part=document.createElement("div");
    part.classList.add("snake-part");

    if(type==="head"){
      part.classList.add("snake-head");
      part.style.backgroundImage=`url("${SETTINGS.headImage}")`;
    }else if(type==="tail"){
      part.classList.add("snake-tail");
      part.style.backgroundImage=`url("${SETTINGS.tailImage}")`;
    }else{
      part.classList.add("snake-body");
      part.style.backgroundImage=`url("${SETTINGS.bodyImages[index%SETTINGS.bodyImages.length]}")`;
    }

    area.appendChild(part);
    return part;
  }

  function startGame(){
    clearGame();

    playing=true;
    collected=0;
    scoreEl.textContent="0 / "+SETTINGS.targetCount;

    startScreen.style.display="none";
    endScreen.style.display="none";
    crosshair.style.display="block";
    root.style.cursor="none";

    const rect=areaRect();
    const startX=rect.width/2;
    const startY=rect.height/2;

    mouse.x=startX+180;
    mouse.y=startY;
    targetMouse.x=mouse.x;
    targetMouse.y=mouse.y;

    for(let i=0;i<SETTINGS.startLength;i++){
      let type="body";
      if(i===0) type="head";
      else if(i===SETTINGS.startLength-1) type="tail";

      const part=createSnakePart(type,i);
      snake.push({x:startX-i*SETTINGS.segmentDistance,y:startY,el:part,type});
    }

    spawnItem();
    spawnBombsCycle();
    loop();
  }

  function endGame(win){
    playing=false;
    if(animationId) cancelAnimationFrame(animationId);
    if(bombTimer) clearTimeout(bombTimer);

    crosshair.style.display="none";
    root.style.cursor="default";
    endScreen.style.display="flex";

    if(win){
      endTitle.textContent="Победа!";
      endText.textContent="Ты собрал все картинки!";
    }else{
      endTitle.textContent="Попробуй ещё раз!";
      endText.textContent="Гусеница столкнулась с бомбочкой или краем поля.";
    }
  }

  function spawnItem(){
    if(item && item.el) item.el.remove();

    let pos, tries=0;
    do{
      pos=safeRandomPoint(120);
      tries++;
    }while(
      (
        (snake[0] && distance(pos,snake[0])<170) ||
        bombs.some(b=>distance(pos,b)<160)
      ) && tries<80
    );

    const el=document.createElement("div");
    el.className="collect-item";
    el.style.backgroundImage=`url("${SETTINGS.itemImage}")`;
    area.appendChild(el);

    item={x:pos.x,y:pos.y,el};
    placeElement(el,pos.x,pos.y);
  }

  function collectItem(){
    collected++;
    scoreEl.textContent=collected+" / "+SETTINGS.targetCount;

    makePop(item.x,item.y,"✨");

    if(item && item.el) item.el.remove();
    item=null;

    growSnake();

    if(collected>=SETTINGS.targetCount){
      endGame(true);
      return;
    }

    spawnItem();
  }

  function growSnake(){
    const oldTail=snake[snake.length-1];

    oldTail.el.classList.remove("snake-tail");
    oldTail.el.classList.add("snake-body");
    oldTail.el.style.backgroundImage=`url("${SETTINGS.bodyImages[snake.length%SETTINGS.bodyImages.length]}")`;
    oldTail.type="body";

    for(let i=0;i<SETTINGS.growBy;i++){
      const isLast=i===SETTINGS.growBy-1;
      const type=isLast ? "tail" : "body";
      const part=createSnakePart(type,snake.length+i);

      snake.push({x:oldTail.x,y:oldTail.y,el:part,type});
    }
  }

  function spawnBombsCycle(){
    bombs.forEach(b=>{
      if(b.el) b.el.remove();
    });
    bombs=[];

    for(let i=0;i<SETTINGS.bombCount;i++){
      spawnBomb();
    }

    bombTimer=setTimeout(()=>{
      bombs.forEach(b=>{
        if(b.el){
          makeExplosion(b.x,b.y);
          b.el.remove();
        }
      });

      bombs=[];

      bombTimer=setTimeout(()=>{
        if(playing) spawnBombsCycle();
      },SETTINGS.bombRespawnDelayMs);

    },SETTINGS.bombLifeMs);
  }

  function spawnBomb(){
    let pos, tries=0;

    do{
      pos=safeRandomPoint(120);
      tries++;
    }while(
      (
        (snake[0] && distance(pos,snake[0])<190) ||
        (item && distance(pos,item)<180) ||
        bombs.some(b=>distance(pos,b)<170)
      ) && tries<120
    );

    const el=document.createElement("div");
    el.className="bomb safe";
    el.style.backgroundImage=`url("${SETTINGS.bombImage}")`;
    area.appendChild(el);
    placeElement(el,pos.x,pos.y);

    const bomb={x:pos.x,y:pos.y,el,safe:true};
    bombs.push(bomb);

    setTimeout(()=>{
      if(!playing || !bomb.el) return;
      bomb.safe=false;
      bomb.el.classList.remove("safe");
    },SETTINGS.bombSafeMs);
  }

  function makeExplosion(x,y){
    const el=document.createElement("div");
    el.className="explosion";
    el.style.backgroundImage=`url("${SETTINGS.explosionImage}")`;
    area.appendChild(el);
    placeElement(el,x,y);
    setTimeout(()=>el.remove(),500);
  }

  function makePop(x,y,text){
    const el=document.createElement("div");
    el.className="pop";
    el.textContent=text;
    area.appendChild(el);
    placeElement(el,x,y);
    setTimeout(()=>el.remove(),650);
  }

  function updateSnake(){
    mouse.x+=(targetMouse.x-mouse.x)*SETTINGS.pointerSmooth;
    mouse.y+=(targetMouse.y-mouse.y)*SETTINGS.pointerSmooth;

    const head=snake[0];
    const dx=mouse.x-head.x;
    const dy=mouse.y-head.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const step=Math.min(SETTINGS.snakeSpeed,dist);

    head.x+=(dx/dist)*step;
    head.y+=(dy/dist)*step;

    let angle=Math.atan2(dy,Math.abs(dx))*180/Math.PI;
    if(angle>55) angle=55;
    if(angle<-55) angle=-55;

    const faceSide=dx<0 ? -1 : 1;
    head.el.style.transform=`translate3d(-50%,-50%,0) rotate(${angle}deg) scaleX(${faceSide})`;

    for(let i=1;i<snake.length;i++){
      const prev=snake[i-1];
      const cur=snake[i];

      const dx2=prev.x-cur.x;
      const dy2=prev.y-cur.y;
      const d=Math.sqrt(dx2*dx2+dy2*dy2)||1;

      if(d>SETTINGS.segmentDistance){
        const move=(d-SETTINGS.segmentDistance)*SETTINGS.bodyFollow;
        cur.x+=(dx2/d)*move;
        cur.y+=(dy2/d)*move;
      }

      if(cur.type==="tail"){
        const tailAngle=Math.atan2(dy2,dx2)*180/Math.PI;
        cur.el.style.transform=`translate3d(-50%,-50%,0) rotate(${tailAngle}deg)`;
      }else{
        cur.el.style.transform="translate3d(-50%,-50%,0)";
      }
    }

    snake.forEach(part=>{
      part.el.style.left=part.x+"px";
      part.el.style.top=part.y+"px";
    });
  }

  function checkCollisions(){
    const rect=areaRect();
    const head=snake[0];
    const pad=SETTINGS.wallPadding;

    if(head.x<pad || head.y<pad || head.x>rect.width-pad || head.y>rect.height-pad){
      endGame(false);
      return;
    }

    if(item && distance(head,item)<58){
      collectItem();
      return;
    }

    for(const bomb of bombs){
      if(!bomb.safe && distance(head,bomb)<50){
        makeExplosion(bomb.x,bomb.y);
        if(bomb.el) bomb.el.remove();

        playing=false;
        setTimeout(()=>endGame(false),350);
        return;
      }
    }
  }

  function loop(){
    if(!playing) return;
    updateSnake();
    checkCollisions();
    animationId=requestAnimationFrame(loop);
  }

  function movePointer(clientX,clientY){
    const rect=areaRect();
    targetMouse.x=clientX-rect.left;
    targetMouse.y=clientY-rect.top;

    crosshair.style.left=clientX+"px";
    crosshair.style.top=clientY+"px";
  }

  root.addEventListener("mousemove",e=>{
    if(!playing) return;
    movePointer(e.clientX,e.clientY);
  });

  root.addEventListener("touchmove",e=>{
    if(!playing) return;
    e.preventDefault();
    const t=e.touches[0];
    movePointer(t.clientX,t.clientY);
  },{passive:false});

  startBtn.addEventListener("click",startGame);
  restartBtn.addEventListener("click",startGame);
})();
</script>
</body>
</html>
