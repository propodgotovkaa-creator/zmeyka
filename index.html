<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Редактор игры Гусеница</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:30px;
  background:#f5f7fb;
  font-family:Arial,sans-serif;
}

.wrapper{
  max-width:1100px;
  margin:auto;
}

h1{
  margin-top:0;
  color:#2d4d66;
}

.section{
  background:#fff;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:700;
  color:#355166;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5dce5;
  border-radius:12px;
  margin-bottom:14px;
  font-size:15px;
}

textarea{
  resize:vertical;
  min-height:90px;
}

.imagesGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.imageField{
  background:#f8fafc;
  padding:12px;
  border-radius:12px;
}

.imageField span{
  display:block;
  margin-bottom:6px;
  font-weight:700;
}

button{
  border:none;
  border-radius:16px;
  padding:16px 26px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  background:#4f7cff;
  color:white;
}

button:hover{
  opacity:.92;
}

#result{
  margin-top:20px;
}

#gameLink,
#iframeCode{
  width:100%;
  min-height:120px;
  font-family:monospace;
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Редактор игры «Гусеница»</h1>

<div class="section">

<h2>Текст до игры</h2>

<label>Заголовок</label>
<input id="titleStart"
value="Гусеница">

<label>Текст</label>
<textarea id="textStart">Собери все картинки и не попади в бомбочки.</textarea>

</div>

<div class="section">

<h2>Текст после победы</h2>

<label>Заголовок</label>
<input id="titleWin"
value="Молодец!">

<label>Текст</label>
<textarea id="textWin">Ты выполнил задание!</textarea>

</div>

<div class="section">

<h2>Картинки</h2>

<div class="imagesGrid">

<div class="imageField">
<span>Картинка 1</span>
<input id="img1">
</div>

<div class="imageField">
<span>Картинка 2</span>
<input id="img2">
</div>

<div class="imageField">
<span>Картинка 3</span>
<input id="img3">
</div>

<div class="imageField">
<span>Картинка 4</span>
<input id="img4">
</div>

<div class="imageField">
<span>Картинка 5</span>
<input id="img5">
</div>

<div class="imageField">
<span>Картинка 6</span>
<input id="img6">
</div>

<div class="imageField">
<span>Картинка 7</span>
<input id="img7">
</div>

<div class="imageField">
<span>Картинка 8</span>
<input id="img8">
</div>

<div class="imageField">
<span>Картинка 9</span>
<input id="img9">
</div>

<div class="imageField">
<span>Картинка 10</span>
<input id="img10">
</div>

<div class="imageField">
<span>Картинка 11</span>
<input id="img11">
</div>

<div class="imageField">
<span>Картинка 12</span>
<input id="img12">
</div>

<div class="imageField">
<span>Картинка 13</span>
<input id="img13">
</div>

<div class="imageField">
<span>Картинка 14</span>
<input id="img14">
</div>

<div class="imageField">
<span>Картинка 15</span>
<input id="img15">
</div>

</div>

</div>

<div class="section">

<button id="generateBtn">
Создать игру
</button>

<div id="result">

<h3>Ссылка</h3>

<textarea id="gameLink"></textarea>

<h3>Iframe для Genially</h3>

<textarea id="iframeCode"></textarea>

</div>

</div>

</div>
<script>
const generateBtn = document.getElementById("generateBtn");
const gameLink = document.getElementById("gameLink");
const iframeCode = document.getElementById("iframeCode");

generateBtn.addEventListener("click", () => {
  const params = [];

  params.push("title=" + encodeURIComponent(document.getElementById("titleStart").value.trim()));
  params.push("start=" + encodeURIComponent(document.getElementById("textStart").value.trim()));
  params.push("win=" + encodeURIComponent(document.getElementById("titleWin").value.trim()));
  params.push("wintext=" + encodeURIComponent(document.getElementById("textWin").value.trim()));

  for(let i = 1; i <= 15; i++){
    const value = document.getElementById("img" + i).value.trim();
    if(value){
      params.push("img" + i + "=" + encodeURIComponent(value));
    }
  }

  const gameUrl =
    "https://propodgotovkaa-creator.github.io/zmeyka/game.html?" +
    params.join("&");

  gameLink.value = gameUrl;

  iframeCode.value =
`<iframe src="${gameUrl}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
});
</script>

</body>
</html>
