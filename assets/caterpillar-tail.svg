<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="tailGrad" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#ffc0ff"/>
      <stop offset="25%" stop-color="#ef6cff"/>
      <stop offset="58%" stop-color="#b03be8"/>
      <stop offset="100%" stop-color="#6c18b0"/>
    </radialGradient>

    <radialGradient id="tailShine" cx="35%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="44%" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#47106f" flood-opacity=".30"/>
    </filter>
  </defs>

  <!-- shadow -->
  <ellipse cx="250" cy="405" rx="120" ry="28" fill="#40105c" opacity=".15"/>

  <!-- tail -->
  <path
    d="M120 240
       C120 135 198 78 282 82
       C370 86 425 148 420 230
       C416 302 364 350 286 362
       C252 367 218 368 188 355
       C233 338 252 312 250 276
       C248 237 220 208 176 194
       C155 188 138 188 120 192
       Z"
    fill="url(#tailGrad)"
    filter="url(#softShadow)"
  />

  <!-- glossy highlight -->
  <ellipse
    cx="210"
    cy="148"
    rx="58"
    ry="30"
    fill="url(#tailShine)"
    transform="rotate(-18 210 148)"
    opacity=".88"
  />

  <!-- cute pink spots -->
  <ellipse cx="318" cy="272" rx="28" ry="38" fill="#ff60d0" opacity=".58" transform="rotate(14 318 272)"/>
  <ellipse cx="190" cy="295" rx="24" ry="34" fill="#ff7ae2" opacity=".45" transform="rotate(-12 190 295)"/>
  <circle cx="325" cy="165" r="15" fill="#ff8ae6" opacity=".28"/>

  <!-- sparkle -->
  <circle cx="362" cy="190" r="6" fill="#ffffff" opacity=".25"/>
</svg>