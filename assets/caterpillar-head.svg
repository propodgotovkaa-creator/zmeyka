<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="headGrad" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#ffb4ff"/>
      <stop offset="28%" stop-color="#e866ff"/>
      <stop offset="58%" stop-color="#a934e6"/>
      <stop offset="100%" stop-color="#6b17b3"/>
    </radialGradient>

    <radialGradient id="shineGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeGrad" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#efe6ff"/>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#47106f" flood-opacity=".34"/>
    </filter>

    <filter id="innerSoft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- shadow -->
  <ellipse cx="258" cy="444" rx="150" ry="34" fill="#40105c" opacity=".18"/>

  <!-- antennas -->
  <g stroke="#5b178e" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M192 108 C178 63 159 37 132 29"/>
    <path d="M320 108 C334 63 353 37 380 29"/>
  </g>
  <circle cx="124" cy="28" r="31" fill="url(#headGrad)" filter="url(#softShadow)"/>
  <circle cx="388" cy="28" r="31" fill="url(#headGrad)" filter="url(#softShadow)"/>
  <circle cx="114" cy="17" r="10" fill="#fff" opacity=".45"/>
  <circle cx="378" cy="17" r="10" fill="#fff" opacity=".45"/>

  <!-- head -->
  <circle cx="256" cy="260" r="178" fill="url(#headGrad)" filter="url(#softShadow)"/>

  <!-- glossy highlights -->
  <ellipse cx="192" cy="155" rx="75" ry="40" fill="url(#shineGrad)" opacity=".75" transform="rotate(-20 192 155)"/>
  <circle cx="158" cy="222" r="18" fill="#ff97ff" opacity=".38"/>
  <circle cx="344" cy="194" r="14" fill="#ff97ff" opacity=".25"/>

  <!-- eyebrows -->
  <path d="M143 180 C171 151 205 151 228 177" stroke="#42105f" stroke-width="16" stroke-linecap="round" fill="none" opacity=".85"/>
  <path d="M284 177 C310 151 345 151 371 180" stroke="#42105f" stroke-width="16" stroke-linecap="round" fill="none" opacity=".85"/>

  <!-- eyes -->
  <g>
    <ellipse cx="185" cy="244" rx="54" ry="68" fill="url(#eyeGrad)" stroke="#5b247b" stroke-width="8"/>
    <ellipse cx="327" cy="244" rx="54" ry="68" fill="url(#eyeGrad)" stroke="#5b247b" stroke-width="8"/>

    <circle cx="197" cy="258" r="30" fill="#1e2142"/>
    <circle cx="339" cy="258" r="30" fill="#1e2142"/>

    <circle cx="185" cy="238" r="13" fill="#fff"/>
    <circle cx="327" cy="238" r="13" fill="#fff"/>
    <circle cx="207" cy="276" r="6" fill="#fff" opacity=".75"/>
    <circle cx="349" cy="276" r="6" fill="#fff" opacity=".75"/>
  </g>

  <!-- cheeks -->
  <ellipse cx="130" cy="318" rx="36" ry="26" fill="#ff6fae" opacity=".88"/>
  <ellipse cx="382" cy="318" rx="36" ry="26" fill="#ff6fae" opacity=".88"/>

  <!-- mouth -->
  <path d="M224 323 C236 370 277 381 304 324" fill="#4a113b"/>
  <path d="M240 354 C258 371 284 371 300 352 C283 349 260 349 240 354Z" fill="#ff6f9c"/>
  <path d="M224 323 C236 370 277 381 304 324" fill="none" stroke="#38112f" stroke-width="7" stroke-linejoin="round"/>

  <!-- tiny nose dots -->
  <circle cx="244" cy="305" r="4.5" fill="#53116f" opacity=".42"/>
  <circle cx="268" cy="305" r="4.5" fill="#53116f" opacity=".42"/>
</svg>
